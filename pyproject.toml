[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "magicborder"
version = "0.1.0"
description = "Desktop app for plant leaf contour detection and editing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=10.3",
  "PyQt5>=5.15.10",
]

[project.scripts]
magicborder = "magicborder.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magicborder"]

[tool.hatch.build.targets.wheel.force-include]
"src/magicborder/assets" = "magicborder/assets"

[tool.uv]
package = true
