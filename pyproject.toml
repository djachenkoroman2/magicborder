[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "magicborder"
version = "0.1.0"
description = "Desktop app for plant leaf contour detection and editing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "Pillow>=10.3",
  "PyQt5>=5.15.10,<5.16",
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "PyQt5-Qt5>=5.15.18,<5.16; sys_platform != 'win32'",
]

[project.scripts]
magicborder = "magicborder.main:main"

[project.gui-scripts]
magicborder-gui = "magicborder.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magicborder"]

[tool.hatch.build.targets.wheel.force-include]
"src/magicborder/assets" = "magicborder/assets"
"oiv_ampelometric_scales.json" = "magicborder/oiv_ampelometric_scales.json"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
