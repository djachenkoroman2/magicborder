[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[project]
name = "magicborder"
version = "0.1.0"
description = "Desktop app for plant leaf contour detection and editing."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.4,<2.5",
  "opencv-python-headless>=4.13.0.92,<4.14",
  "Pillow>=12.2,<13",
  "PyQt5>=5.15.11,<5.16",
  "PyQt5-sip>=12.18,<13",
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "PyQt5-Qt5>=5.15.19,<5.16; sys_platform != 'win32'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6,<7",
]

[project.scripts]
magicborder = "magicborder.main:main"

[project.gui-scripts]
magicborder-gui = "magicborder.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magicborder"]

[tool.hatch.build.targets.wheel.force-include]
"src/magicborder/assets" = "magicborder/assets"
"oiv_ampelometric_scales.json" = "magicborder/oiv_ampelometric_scales.json"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
